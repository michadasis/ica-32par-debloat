plugins { id 'com.android.application' }

android {
    namespace 'com.cleanhome.dpadnav'
    compileSdk 35
    defaultConfig {
        applicationId "com.cleanhome.dpadnav"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { }
