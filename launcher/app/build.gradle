plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cleanhome.tv'
    compileSdk 35

    defaultConfig {
        applicationId "com.cleanhome.tv"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // signed with debug key; fine for sideload
        }
        debug {
            // default debug signing
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Keep the APK tiny and fast to install on a 1GB TV.
    packagingOptions {
        resources {
            excludes += ['META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
